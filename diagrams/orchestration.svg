<svg width="560" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Pipeline orchestration</title>
  <desc>EventBridge Scheduler triggers an outer Step Functions state machine handling DMS and crawling, which synchronously invokes an inner state machine running the Glue ETL jobs in sequence. Lambda functions act as task workers and SNS sends failure alerts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="240" y="20" width="200" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="340" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">EventBridge Scheduler</text>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#854F0B">Nightly trigger</text>
  <line x1="340" y1="68" x2="340" y2="90" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="92" width="500" height="132" rx="14" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="110" y="118" font-size="14" font-weight="500" fill="#0C447C">Step functions — DMS_Raw (outer)</text>

  <rect x="110" y="150" width="140" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="180" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Archive + DMS</text>
  <text x="180" y="191" text-anchor="middle" font-size="12" fill="#185FA5">start, poll status</text>

  <rect x="270" y="150" width="140" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="340" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Raw crawler</text>
  <text x="340" y="191" text-anchor="middle" font-size="12" fill="#185FA5">catalog parquet</text>

  <rect x="430" y="150" width="140" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="500" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Validate raw</text>
  <text x="500" y="191" text-anchor="middle" font-size="12" fill="#185FA5">quality gate</text>

  <line x1="340" y1="224" x2="340" y2="248" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#5F5E5A">startExecution.sync</text>

  <rect x="90" y="250" width="500" height="150" rx="14" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="110" y="276" font-size="14" font-weight="500" fill="#3C3489">Step functions — improved_pipeline (inner)</text>

  <rect x="110" y="308" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="160" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Raw → L1</text>
  <text x="160" y="349" text-anchor="middle" font-size="12" fill="#534AB7">clean</text>

  <rect x="230" y="308" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="280" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Dims</text>
  <text x="280" y="349" text-anchor="middle" font-size="12" fill="#534AB7">SCD2 merge</text>

  <rect x="350" y="308" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Facts</text>
  <text x="400" y="349" text-anchor="middle" font-size="12" fill="#534AB7">Kimball CTAS</text>

  <rect x="470" y="308" width="100" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="520" y="332" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Publish</text>
  <text x="520" y="349" text-anchor="middle" font-size="12" fill="#534AB7">→ Postgres</text>

  <line x1="240" y1="400" x2="205" y2="446" stroke="#9c9a92" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="400" x2="475" y2="446" stroke="#9c9a92" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="70" y="448" width="240" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="190" y="471" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Lambda task workers</text>
  <text x="190" y="488" text-anchor="middle" font-size="12" fill="#5F5E5A">start + poll Glue, DMS, crawlers</text>

  <rect x="370" y="448" width="240" height="52" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="490" y="471" text-anchor="middle" font-size="14" font-weight="500" fill="#791F1F">SNS notifications</text>
  <text x="490" y="488" text-anchor="middle" font-size="12" fill="#A32D2D">failure alerts on any state</text>
</svg>
